repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: [-style=file, -i]
        files: ^firmware/.*\.(c|h)$

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [format, ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj,
               --verify-no-changes, --verbosity, normal]

      - id: dotnet-restore
        name: dotnet restore
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [restore, ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj]

      - id: dotnet-test
        name: dotnet test
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [test, tests/NukCPGDrop.Ui.Tests/, -c, Release]

      - id: firmware-test
        name: ESP-IDF firmware unit tests
        language: system
        pass_filenames: false
        always_run: true
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os;
            idf = os.environ.get('IDF_PATH','') + '/tools/idf.py';
            if not os.path.exists(idf):
              idf = 'C:/Users/thedy/source/repos/esp-idf/tools/idf.py';
            r = subprocess.run([sys.executable, idf, 'build', '--target', 'test'], cwd='firmware', capture_output=True);
            if r.returncode != 0:
              print('[warn] Firmware test failed - pass with --no-verify to skip');
            sys.exit(0)

      - id: full-pipeline
        name: Full pipeline: publish + embed + firmware (~20s incremental)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os;
            r = subprocess.run(['dotnet','publish','ui/NukCPGDrop.Ui/','-c','Release','-o','publish/wwwroot'], capture_output=True);
            if r.returncode != 0: print('dotnet publish FAILED'); print(r.stderr.decode()[-500:]); sys.exit(r.returncode);
            r = subprocess.run([sys.executable, 'scripts/embed-web.py', 'publish/wwwroot', 'firmware/main/include/web_assets.h', 'prepush'], capture_output=True);
            if r.returncode != 0: print('embed-web FAILED'); print(r.stderr.decode()[-500:]); sys.exit(r.returncode);
            idf = os.environ.get('IDF_PATH','') + '/tools/idf.py';
            if not os.path.exists(idf): idf = 'C:/Users/thedy/source/repos/esp-idf/tools/idf.py';
            r = subprocess.run([sys.executable, idf, 'build'], cwd='firmware');
            if r.returncode != 0: print('firmware build FAILED'); sys.exit(r.returncode);
            print('  Pipeline OK')

      - id: firmware-build-e2e
        name: ESP-IDF firmware build (DevKitC E2E)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os, shutil;
            os.chdir('firmware');
            idf = os.environ.get('IDF_PATH','') + '/tools/idf.py';
            if not os.path.exists(idf):
              idf = 'C:/Users/thedy/source/repos/esp-idf/tools/idf.py';
            shutil.copy('sdkconfig.defaults', 'sdkconfig.defaults._save');
            shutil.copy('sdkconfig.defaults.e2e', 'sdkconfig.defaults');
            if os.path.exists('sdkconfig'): os.remove('sdkconfig');
            r = subprocess.run([sys.executable, idf, '-B', 'build_devkitc', 'build']);
            shutil.copy('sdkconfig.defaults._save', 'sdkconfig.defaults');
            os.remove('sdkconfig.defaults._save');
            sys.exit(r.returncode)

      - id: create-firmware-bundle
        name: Create firmware release bundle
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os, shutil;
            binfile = 'firmware/build/NukCPGDrop.bin';
            if not os.path.exists(binfile):
              print('[skip] firmware/build/NukCPGDrop.bin not found'); sys.exit(0);
            script = 'scripts/create-firmware-bundle.py';
            version = subprocess.run(['git','describe','--tags','--always','--dirty'],
              capture_output=True,text=True).stdout.strip() or 'dev';
            out = f'NukCPGDrop-Display-{version}.zip';
            print(f'  Creating bundle: {out}');
            r = subprocess.run([sys.executable, script, 'firmware/build', out,
              '--board', 'DisplayBoard', '--version', version]);
            if r.returncode != 0: sys.exit(r.returncode);
            # Create manifest.json for the WebSerial flasher
            import json, hashlib;
            mfiles = [];
            for mf in ['bootloader.bin','partition-table.bin','NukCPGDrop.bin','ota_data_initial.bin']:
                mp = f'docs/flash/firmware/{mf}';
                if os.path.exists(mp):
                    md = open(mp,'rb').read();
                    mfiles.append({'name':mf,'size':len(md),'md5':hashlib.md5(md).hexdigest()});
            with open('docs/flash/firmware/manifest.json','w') as mj:
                json.dump({'version':version,'files':mfiles}, mj, indent=2);
            print(f'  Created docs/flash/firmware/manifest.json (version {version})');
            # Move the latest tag to this commit so firmware files are accessible at the tag ref
            import glob;
            tags = sorted(glob.glob('docs/flash/firmware/*.bin'));
            if tags:
                tag = subprocess.run(['git','describe','--tags','--abbrev=0','--match','v*'],
                    capture_output=True,text=True).stdout.strip();
                if tag:
                    subprocess.run(['git','tag','-f',tag,'HEAD'],capture_output=True);
                    print(f'  Moved tag {tag} to HEAD');
            # Copy firmware files to docs/flash/firmware/ for CORS-free serving via GitHub Pages
            os.makedirs('docs/flash/firmware', exist_ok=True);
            paths = {'bootloader.bin':'bootloader/bootloader.bin','partition-table.bin':'partition_table/partition-table.bin',
                     'NukCPGDrop.bin':'NukCPGDrop.bin','ota_data_initial.bin':'ota_data_initial.bin'};
            for name, rel in paths.items():
                src = f'firmware/build/{rel}';
                if os.path.exists(src):
                    shutil.copy2(src, f'docs/flash/firmware/{name}');
                    print(f'  Copied {src} -> docs/flash/firmware/{name}');
            sys.exit(0)

      - id: create-github-release
        name: Create/update GitHub release
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os, glob;
            branch = subprocess.run(['git','rev-parse','--abbrev-ref','HEAD'],
              capture_output=True,text=True).stdout.strip();
            if branch != 'master':
              print('[skip] Not on master'); sys.exit(0);
            tag = subprocess.run(['git','describe','--tags','--abbrev=0','--match','v*'],
              capture_output=True,text=True).stdout.strip();
            if not tag:
              # Auto-create a version tag from run number or date
              import datetime;
              tag = f'v1.2.{datetime.date.today().strftime("%y%m%d")}';
              subprocess.run(['git','tag','-f',tag,'HEAD'],capture_output=True);
              print(f'  Auto-created tag {tag}');
            # Verify the tag matches firmware PROJECT_VER
            fwver = subprocess.run([sys.executable,'-c','import subprocess as sp; import os;'
              'idf=os.environ.get("IDF_PATH","")+"/tools/idf.py";'
              'r=sp.run([sys.executable,idf,"reconfigure"],cwd="firmware",capture_output=True,text=True);'
              'for l in r.stdout.split("\\n"):'
              ' if "App.*version:" in l or "version:" in l: print(l.strip())'],
              capture_output=True,text=True).stdout.strip();
            if fwver and tag not in fwver:
              print(f'[warn] Tag {tag} may not match firmware version: {fwver[:80]}');
            zips = glob.glob(f'NukCPGDrop-Display-{tag}.zip');
            if not zips:
              print(f'[skip] Bundle not found for {tag}'); sys.exit(0);
            zipfile = zips[0];
            r = subprocess.run(['gh','release','view',tag,'--json','tagName'],
              capture_output=True,text=True);
            exists = r.returncode == 0;
            if not exists:
              print(f'Creating release {tag}...');
              subprocess.run(['gh','release','create',tag,'--title',
                f'NukCPGDrop {tag}','--notes','Local build','--draft']);
            print(f'Uploading {zipfile}...');
            subprocess.run(['gh','release','upload',tag,zipfile,'--clobber']);
            if exists: print(f'Updated release {tag}');
            else: print(f'Created draft release {tag} - publish with: gh release edit {tag} --draft=false')

      - id: e2e-test-qemu
        name: E2E QEMU test (Playwright)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os;
            if not os.path.exists('.qemu/qemu/bin/qemu-system-xtensa.exe'):
              print('[skip] QEMU not installed'); sys.exit(0);
            r = subprocess.run(['npx', 'mocha', 'tests/e2e/firmware.test.js',
              '--timeout', '60000']);
            if r.returncode != 0:
              print('[warn] QEMU E2E test failed - pass with --no-verify to skip');
            sys.exit(0)

      - id: e2e-test-hardware
        name: E2E hardware test (when board connected)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: python
        args:
          - -c
          - >
            import subprocess, sys, os;
            board = os.environ.get('BOARD_TYPE','qemu');
            if not board or board == 'qemu':
              print('[skip] BOARD_TYPE not set (E2EBoard or DisplayBoard)'); sys.exit(0);
            env = {**os.environ, 'TARGET_URL': 'http://192.168.4.1'};
            print(f'Running E2E tests for board {board}');
            r = subprocess.run(['npx', 'mocha', 'tests/e2e/firmware.test.js',
              '--timeout', '120000'], env=env);
            if r.returncode != 0:
              print('[warn] Hardware E2E test failed - pass with --no-verify to skip');
            sys.exit(0)

      # Stryker mutation testing is in CI only (.github/workflows/ci.yml)
      # due to Blazor WASM top-level statements limitation (CS8805).

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--ignore-words-list, "Nuks", --skip, "*.bin,*.zip,*.wasm,*.pdb,node_modules/"]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
