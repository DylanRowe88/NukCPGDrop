repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: [-style=file, -i]
        files: ^firmware/.*\.(c|h)$

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [format, ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj,
               --verify-no-changes, --verbosity, normal]

      - id: dotnet-restore
        name: dotnet restore
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [restore, ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj]

      - id: dotnet-build
        name: dotnet build
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [build, ui/NukCPGDrop.Ui/, -c, Release]

      - id: dotnet-test
        name: dotnet test
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [test, tests/NukCPGDrop.Ui.Tests/, -c, Release, --no-restore]

      - id: firmware-build
        name: ESP-IDF firmware build
        language: system
        pass_filenames: false
        always_run: true
        entry: powershell
        args:
          - -Command
          - >
            $idf = Get-Command idf.py -ErrorAction SilentlyContinue;
            if (-not $idf) { Write-Host "[skip] idf.py not in PATH"; exit 0 };
            $ErrorActionPreference = 'Stop';
            Push-Location firmware;
            idf.py build;
            if ($LASTEXITCODE -ne 0) { exit 1 };
            Pop-Location

      - id: firmware-test
        name: ESP-IDF firmware tests (QEMU)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: powershell
        args:
          - -Command
          - >
            $idf = Get-Command idf.py -ErrorAction SilentlyContinue;
            if (-not $idf) { Write-Host "[skip] idf.py not in PATH"; exit 0 };
            $ErrorActionPreference = 'Stop';
            Push-Location firmware;
            idf.py test;
            if ($LASTEXITCODE -ne 0) { exit 1 };
            Pop-Location

      - id: stryker-mutation
        name: Stryker mutation testing
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: dotnet
        args:
          - tool
          - run
          - dotnet-stryker
          - --project
          - ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj
          - --test-project
          - tests/NukCPGDrop.Ui.Tests/NukCPGDrop.Ui.Tests.csproj
          - --break-at
          - "100"
          - --threshold-break
          - "100"
          - --since

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
