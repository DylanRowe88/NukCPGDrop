repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: [-style=file, -i]
        files: ^firmware/.*\.(c|h)$

  - repo: https://github.com/calav3ra/dotnet-format
    rev: v8.0.0
    hooks:
      - id: dotnet-format
        args: [--verify-no-changes, --folder, ui/, tests/]

  - repo: local
    hooks:
      - id: dotnet-test
        name: .NET Unit Tests
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [test, tests/NukCPGDrop.Ui.Tests/, -c, Release]

      - id: build-firmware
        name: ESP-IDF Firmware Build
        language: system
        pass_filenames: false
        always_run: false
        stages: [push]
        entry: powershell
        args:
          - -Command
          - >
            $ErrorActionPreference='Stop';
            cd firmware;
            idf.py build;
            if ($LASTEXITCODE -ne 0) { exit 1 }

      - id: stryker-mutation
        name: Stryker Mutation Testing
        language: system
        pass_filenames: false
        always_run: false
        stages: [push]
        entry: dotnet
        args:
          - tool
          - run
          - dotnet-stryker
          - --project
          - ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj
          - --test-project
          - tests/NukCPGDrop.Ui.Tests/NukCPGDrop.Ui.Tests.csproj
          - --break-at
          - "100"
          - --threshold-break
          - "100"
          - --since

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
