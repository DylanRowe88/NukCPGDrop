repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: [-style=file, -i]
        files: ^firmware/.*\.(c|h)$

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [format, ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj,
               --verify-no-changes, --verbosity, normal]

      - id: dotnet-restore
        name: dotnet restore
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [restore, ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj]

      - id: dotnet-build
        name: dotnet build
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [build, ui/NukCPGDrop.Ui/, -c, Release]

      - id: dotnet-test
        name: dotnet test
        language: system
        pass_filenames: false
        always_run: true
        entry: dotnet
        args: [test, tests/NukCPGDrop.Ui.Tests/, -c, Release, --no-restore]

      - id: firmware-build
        name: ESP-IDF firmware build
        language: system
        pass_filenames: false
        always_run: true
        entry: powershell
        args:
          - -Command
          - >
            $idf = Get-Command idf.py -ErrorAction SilentlyContinue;
            if (-not $idf) { Write-Host "[skip] idf.py not in PATH"; exit 0 };
            $ErrorActionPreference = 'Stop';
            Push-Location firmware;
            idf.py build;
            if ($LASTEXITCODE -ne 0) { exit 1 };
            Pop-Location

      - id: firmware-build-e2e
        name: ESP-IDF firmware build (DevKitC E2E)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: powershell
        args:
          - -Command
          - >
            $idf = Get-Command idf.py -ErrorAction SilentlyContinue;
            if (-not $idf) { Write-Host "[skip] idf.py not in PATH"; exit 0 };
            $ErrorActionPreference = 'Stop';
            $idf_path = if ($env:IDF_PATH) { $env:IDF_PATH } else { "C:\Users\thedy\source\repos\esp-idf" };
            Push-Location firmware;
            Copy-Item "sdkconfig.defaults" "sdkconfig.defaults._save" -Force;
            Copy-Item "sdkconfig.defaults.e2e" "sdkconfig.defaults" -Force;
            Remove-Item "sdkconfig" -ErrorAction SilentlyContinue;
            python "$idf_path/tools/idf.py" -B build_devkitc build;
            $result = $LASTEXITCODE;
            Copy-Item "sdkconfig.defaults._save" "sdkconfig.defaults" -Force;
            Remove-Item "sdkconfig.defaults._save" -ErrorAction SilentlyContinue;
            if ($result -ne 0) { exit 1 };
            Pop-Location

      - id: create-firmware-bundle
        name: Create firmware release bundle
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: powershell
        args:
          - -Command
          - >
            $ErrorActionPreference = 'Stop';
            $bin = Join-Path $pwd "firmware" "build" "NukCPGDrop.bin";
            if (-not (Test-Path $bin)) {
              Write-Host "[skip] firmware/build/NukCPGDrop.bin not found";
              exit 0 };
            $script = Join-Path $pwd "scripts" "create-firmware-bundle.py";
            $version = git describe --tags --always --dirty 2>$null;
            if (-not $version) { $version = "dev" };
            $out = Join-Path $pwd "NukCPGDrop-Display-$version.zip";
            Write-Host "  Creating bundle: $out";
            python $script (Join-Path $pwd "firmware" "build") $out --board DisplayBoard --version $version;
            if ($LASTEXITCODE -ne 0) { exit 1 }

      - id: e2e-test-qemu
        name: E2E QEMU test (Playwright)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: powershell
        args:
          - -Command
          - >
            if (-not (Test-Path '.qemu/qemu/bin/qemu-system-xtensa.exe')) {
              Write-Host "[skip] QEMU not installed"; exit 0 };
            if (-not (Get-Command npx -ErrorAction SilentlyContinue)) {
              Write-Host "[skip] npx not found"; exit 0 };
            npx mocha tests/e2e/firmware.test.js --timeout 60000 2>&1;
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[warn] QEMU E2E test failed — pass with --no-verify to skip";
              exit 0 }

      - id: e2e-test-hardware
        name: E2E hardware test (when board connected)
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        entry: powershell
        args:
          - -Command
          - >
            $board = $env:BOARD_TYPE;
            if (-not $board -or $board -eq 'qemu') {
              Write-Host "[skip] BOARD_TYPE not set (E2EBoard or DisplayBoard)"; exit 0 };
            if (-not (Get-Command npx -ErrorAction SilentlyContinue)) {
              Write-Host "[skip] npx not found"; exit 0 };
            $env:TARGET_URL = 'http://192.168.4.1';
            Write-Host "Running E2E tests for board $board at $env:TARGET_URL";
            npx mocha tests/e2e/firmware.test.js --timeout 120000 2>&1;
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[warn] Hardware E2E test failed — pass with --no-verify to skip";
              exit 0 }

      # Stryker mutation testing is in CI only (.github/workflows/ci.yml)
      # due to Blazor WASM top-level statements limitation (CS8805).

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
