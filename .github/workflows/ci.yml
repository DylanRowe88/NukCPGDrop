name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: 8.0.x

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ui/NukCPGDrop.Ui/
      - run: dotnet build ui/NukCPGDrop.Ui/ --no-restore -c Release
      - run: dotnet publish ui/NukCPGDrop.Ui/ --no-restore -c Release -o publish/

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore tests/NukCPGDrop.Ui.Tests/
      - run: dotnet test tests/NukCPGDrop.Ui.Tests/ --no-restore -c Release
            /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
      - uses: codecov/codecov-action@v4
        with:
          files: tests/NukCPGDrop.Ui.Tests/coverage.cobertura.xml

  ui-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool install --global dotnet-stryker
      - run: >
          dotnet stryker
          --project ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj
          --test-project tests/NukCPGDrop.Ui.Tests/NukCPGDrop.Ui.Tests.csproj
          --break-at 100
          --threshold-break 100
          --output StrykerOutput

  ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet format ui/ tests/ --verify-no-changes --verbosity diagnostic

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s3
          path: firmware/
          command: idf.py build

  firmware-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with QEMU
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s3
          path: firmware/
          command: idf.py test
      - uses: codecov/codecov-action@v4
        with:
          files: firmware/build/coverage.info

  embed-web:
    runs-on: ubuntu-latest
    needs: [ui-build, firmware-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gzip
      - run: python scripts/embed-web.py publish/wwwroot/ firmware/main/include/web_assets.h
      - uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32s3
          path: firmware/
          command: idf.py build
