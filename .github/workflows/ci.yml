name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 8.0.x

jobs:
  ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet format ui/NukCPGDrop.Ui/ --verify-no-changes --verbosity diagnostic

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore tests/NukCPGDrop.Ui.Tests/
      - run: dotnet test tests/NukCPGDrop.Ui.Tests/ -c Release --no-restore

  draft-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [ui-test, ui-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          cat > release-notes.md <<- EOF
          Build firmware locally with:
            python flash.py --board DisplayBoard
          Then upload the bundle with:
            gh release upload $VERSION NukCPGDrop-Display-$VERSION.zip
          EOF
          gh release create "$VERSION" \
            --title "NukCPGDrop $VERSION" \
            --notes-file release-notes.md \
            --draft
