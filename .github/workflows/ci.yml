name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: 8.0.x
  ESP_IDF_VERSION: v5.2

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ui/NukCPGDrop.Ui/
      - run: dotnet build ui/NukCPGDrop.Ui/ --no-restore -c Release --no-restore
      - run: dotnet publish ui/NukCPGDrop.Ui/ -c Release -o publish/wwwroot --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: ui-publish
          path: publish/

  ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet format ui/NukCPGDrop.Ui/ --verify-no-changes --verbosity diagnostic

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore tests/NukCPGDrop.Ui.Tests/
      - run: dotnet test tests/NukCPGDrop.Ui.Tests/ -c Release --no-restore
            /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
      - uses: codecov/codecov-action@v4
        with:
          files: tests/NukCPGDrop.Ui.Tests/coverage.cobertura.xml

  ui-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: >
          dotnet tool run dotnet-stryker
          --project ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj
          --test-project tests/NukCPGDrop.Ui.Tests/NukCPGDrop.Ui.Tests.csproj
          --break-at 100
          --threshold-break 100
          --output StrykerOutput
          --since

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF (stub web assets)
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          path: firmware/
          command: idf.py build

  firmware-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with QEMU
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          path: firmware/
          command: idf.py test

  embed-and-final-build:
    runs-on: ubuntu-latest
    needs: [ui-build, firmware-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ui-publish
          path: publish/
      - run: python scripts/embed-web.py publish/wwwroot/ firmware/main/include/web_assets.h
      - name: Build ESP-IDF (with embedded web)
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          path: firmware/
          command: idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-full
          path: firmware/build/NukCPGDrop.bin
