name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: 8.0.x
  ESP_IDF_VERSION: v5.2

jobs:
  ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet format ui/NukCPGDrop.Ui/ --verify-no-changes --verbosity diagnostic

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore tests/NukCPGDrop.Ui.Tests/
      - run: dotnet test tests/NukCPGDrop.Ui.Tests/ -c Release --no-restore
            /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
      - uses: codecov/codecov-action@v4
        with:
          files: tests/NukCPGDrop.Ui.Tests/coverage.cobertura.xml

  ui-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: >
          dotnet tool run dotnet-stryker
          --project ui/NukCPGDrop.Ui/NukCPGDrop.Ui.csproj
          --test-project tests/NukCPGDrop.Ui.Tests/NukCPGDrop.Ui.Tests.csproj
          --break-at 100 --threshold-break 100
          --output StrykerOutput --since

  build-and-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Build UI → embed-web.py runs automatically via csproj AfterPublish target
      - name: Build and publish Blazor WASM
        run: |
          dotnet publish ui/NukCPGDrop.Ui/ -c Release -o publish/wwwroot

      # Build firmware (will pick up the regenerated web_assets.h)
      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          path: firmware/
          command: idf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/NukCPGDrop.bin

  firmware-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with QEMU
        uses: espressif/esp-idf-github-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: esp32s3
          path: firmware/
          command: idf.py test
